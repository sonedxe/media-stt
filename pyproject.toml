[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-stt"
dynamic = ["version"]
description = "Local, cross-platform speech-to-text for any ffmpeg-readable audio, including WhatsApp voice notes."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "sonedxe" }]
keywords = ["speech-to-text", "whisper", "mlx", "faster-whisper", "transcription", "cross-platform"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "tqdm>=4.66",
    # Apple Silicon gets MLX; everything else gets faster-whisper (CTranslate2).
    "mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.0; sys_platform != 'darwin' or platform_machine != 'arm64'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
cpu = ["faster-whisper>=1.0"]

[project.scripts]
media-stt = "media_stt.cli:main"

[project.urls]
Homepage = "https://github.com/sonedxe/media-stt"
Issues = "https://github.com/sonedxe/media-stt/issues"

[tool.setuptools.dynamic]
version = { attr = "media_stt.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
media_stt = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
